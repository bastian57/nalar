# Nalar — Backfill thumbnail ilustrasi AI (v5.4, MANUAL).
# Mengganti thumbnail foto stok generik artikel lama menjadi ilustrasi AI
# Pollinations (prompt dari judul + image_desc). Dijalankan manual dari tab
# Actions (workflow_dispatch), default 30 artikel terbaru per jalan — ulangi
# sampai semua artikel lama ter-cover. Commit TANPA [skip ci] agar situs
# ikut rebuild dan thumbnail baru tayang.
name: Nalar Backfill Images

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Jumlah artikel per jalan"
        required: false
        default: "30"

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Backfill thumbnails
        run: python scripts/backfill_pollinations.py --limit "${{ inputs.limit }}"

      - name: Commit & push
        run: |
          git config user.name "nalar-bot"
          git config user.email "nalar-bot[bot]@users.noreply.github.com"
          git add src/content/articles/
          if git diff --cached --quiet; then
            echo "Tidak ada artikel diperbarui — skip commit."
          else
            git commit -m "🖼️ Backfill thumbnail ilustrasi AI ($(date -u +%Y-%m-%d_UTC))"
            git push
          fi
