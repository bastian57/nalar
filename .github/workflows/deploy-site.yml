# Nalar — deploy terjadwal 2x/hari (hemat jatah build Cloudflare Pages: 500/bln).
# Commit kosong TANPA [skip ci] -> memicu Pages build -> artikel yang
# dikumpulkan pipeline per jam tayang di situs 2x sehari (07:05 & 19:05 WIB).
name: Nalar Site Deploy

on:
  schedule:
    - cron: '5 0,12 * * *'   # 07:05 & 19:05 WIB
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Trigger Pages build (empty commit)
        run: |
          git config user.name "nalar-bot"
          git config user.email "nalar-bot[bot]@users.noreply.github.com"
          git commit --allow-empty -m "🔄 Deploy terjadwal ($(date -u +%Y-%m-%d_%H:%M_UTC))"
          git push
