# Nalar — content pipeline otonom v5.2
# 1 artikel/jam, rotasi 6 kategori (politik, ekonomi, global, teknologi,
# sejarah, konspirasi). Deploy OTOMATIS max tiap 3 jam (~8x/hari = 240/bln,
# hemat jatah build Cloudflare Pages 500/bln): commit tanpa "[skip ci]"
# memicu Pages build. Telegram diposting SETELAH build selesai (tunggu 5 mnt)
# -> link artikel tidak pernah mati. Di antara deploy, commit pakai "[skip ci]".
# Run MANUAL selalu deploy langsung.
name: Nalar News Pipeline

on:
  schedule:
    - cron: '17 * * * *'   # tiap jam, menit 17 (hindari antrian tepat :00)
  workflow_dispatch:
    inputs:
      category:
        description: 'Kategori (kosongkan = rotasi otomatis per jam)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Smoke test (compile check)
        run: |
          python -m py_compile scripts/generate_news.py \
            scripts/archive_engine.py scripts/smart_image.py \
            scripts/telegram_post.py scripts/generate_rss.py \
            scripts/generate_sitemap.py

      - name: Generate artikel
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.category }}" ]; then
            ARGS="--category ${{ inputs.category }}"
          fi
          python scripts/generate_news.py $ARGS

      - name: Commit & push artikel baru
        id: commit
        run: |
          git config user.name "nalar-bot"
          git config user.email "nalar-bot[bot]@users.noreply.github.com"
          # File state deploy & antrean Telegram (v5.2)
          [ -f scripts/last_deploy.txt ] || echo 0 > scripts/last_deploy.txt
          [ -f scripts/pending_posts.json ] || echo "[]" > scripts/pending_posts.json
          git add src/content/articles/ public/rss.xml public/sitemap.xml \
            scripts/state.json scripts/evergreen_queue.json \
            scripts/pending_posts.json scripts/last_deploy.txt
          if git diff --cached --quiet; then
            echo "Tidak ada artikel baru — skip commit."
            echo "has_new=false" >> $GITHUB_OUTPUT
            echo "deployed=false" >> $GITHUB_OUTPUT
          else
            # v5.2: deploy otomatis max tiap 3 jam (hemat build CF Pages:
            # ~8x/hari = 240/bln dari jatah 500). Telegram HANYA diposting
            # setelah deploy -> link tidak pernah mati.
            SHOULD_DEPLOY=false
            LAST_DEPLOY=$(head -1 scripts/last_deploy.txt 2>/dev/null || echo 0)
            NOW=$(date -u +%s)
            if [ $((NOW - LAST_DEPLOY)) -gt 10800 ]; then
              SHOULD_DEPLOY=true
            fi
            if [ "${{ github.event_name }}" != "schedule" ]; then
              SHOULD_DEPLOY=true  # run manual = deploy langsung
            fi
            COUNT=$(git diff --cached --name-only -- 'src/content/articles/*.md' | wc -l)
            if [ "$SHOULD_DEPLOY" = true ]; then
              SKIP=""
              echo "$NOW" > scripts/last_deploy.txt
              git add scripts/last_deploy.txt
              echo "deployed=true" >> $GITHUB_OUTPUT
            else
              SKIP=" [skip ci]"
              echo "deployed=false" >> $GITHUB_OUTPUT
            fi
            git commit -m "📰 Nalar auto v5: $COUNT artikel baru ($(date -u +%Y-%m-%d_%H:%M_UTC))$SKIP"
            git push
            echo "has_new=true" >> $GITHUB_OUTPUT
          fi

      - name: Tunggu build + Post ke Telegram
        if: steps.commit.outputs.deployed == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          sleep 300  # beri waktu Cloudflare Pages build selesai
          python scripts/telegram_post.py --pending
          git config user.name "nalar-bot"
          git config user.email "nalar-bot[bot]@users.noreply.github.com"
          git add scripts/pending_posts.json
          if git diff --cached --quiet; then
            echo "Antrean sudah kosong."
          else
            git commit -m "🧹 Kosongkan antrean Telegram [skip ci]"
            git push
          fi

  notify-failure:
    needs: generate
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Alert Telegram — pipeline gagal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🚨 <b>Nalar pipeline v5 GAGAL</b>%0A🕐 $(date -u +%Y-%m-%d_%H:%M_UTC)%0A🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=HTML" -o /dev/null
