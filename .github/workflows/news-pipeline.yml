# Nalar — content pipeline otonom v5
# 1 artikel/jam, rotasi 6 kategori (politik, ekonomi, global, teknologi,
# sejarah, konspirasi). Commit terjadwal memakai "[skip ci]" agar TIDAK
# memakan jatah build Cloudflare Pages (500/bln gratis); deploy terjadwal
# 2x/hari via deploy-site.yml. Run MANUAL tidak pakai [skip ci] -> deploy
# langsung, artikel baru tayang di situs dalam hitungan menit.
name: Nalar News Pipeline

on:
  schedule:
    - cron: '17 * * * *'   # tiap jam, menit 17 (hindari antrian tepat :00)
  workflow_dispatch:
    inputs:
      category:
        description: 'Kategori (kosongkan = rotasi otomatis per jam)'
        required: false
        default: ''
        type: string

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Smoke test (compile check)
        run: |
          python -m py_compile scripts/generate_news.py \
            scripts/archive_engine.py scripts/smart_image.py \
            scripts/telegram_post.py scripts/generate_rss.py \
            scripts/generate_sitemap.py

      - name: Generate artikel
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.category }}" ]; then
            ARGS="--category ${{ inputs.category }}"
          fi
          python scripts/generate_news.py $ARGS

      - name: Commit & push artikel baru
        id: commit
        run: |
          git config user.name "nalar-bot"
          git config user.email "nalar-bot[bot]@users.noreply.github.com"
          git add src/content/articles/ public/rss.xml public/sitemap.xml \
            scripts/state.json scripts/evergreen_queue.json
          if git diff --cached --quiet; then
            echo "Tidak ada artikel baru — skip commit."
            echo "has_new=false" >> $GITHUB_OUTPUT
          else
            COUNT=$(git diff --cached --name-only -- 'src/content/articles/*.md' | wc -l)
            SKIP=""
            if [ "${{ github.event_name }}" = "schedule" ]; then
              SKIP=" [skip ci]"
            fi
            git commit -m "📰 Nalar auto v5: $COUNT artikel baru ($(date -u +%Y-%m-%d_%H:%M_UTC))$SKIP"
            git push
            echo "has_new=true" >> $GITHUB_OUTPUT
          fi

      - name: Post ke Telegram
        if: steps.commit.outputs.has_new == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_post.py

  notify-failure:
    needs: generate
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Alert Telegram — pipeline gagal
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          MSG="🚨 <b>Nalar pipeline v5 GAGAL</b>%0A🕐 $(date -u +%Y-%m-%d_%H:%M_UTC)%0A🔗 ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}&text=${MSG}&parse_mode=HTML" -o /dev/null
