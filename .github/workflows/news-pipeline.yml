# Nalar — content pipeline otonom
# Jalan tiap 6 jam: 00:00, 06:00, 12:00, 18:00 UTC
# (= 07:00, 13:00, 19:00, 01:00 WIB)
name: Nalar News Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: # tombol "Run workflow" manual dari tab Actions

permissions:
  contents: write # butuh untuk commit & push artikel

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install feedparser requests

      - name: Generate artikel
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python scripts/generate_news.py

      - name: Commit & push artikel baru
        id: commit
        run: |
          git config user.name "nalar-bot"
          git config user.email "nalar-bot[bot]@users.noreply.github.com"
          git add src/content/articles/ public/rss.xml public/sitemap.xml
          if git diff --cached --quiet; then
            echo "Tidak ada artikel baru — skip commit."
            echo "has_new=false" >> $GITHUB_OUTPUT
          else
            COUNT=$(git diff --cached --name-only -- 'src/content/articles/*.md' | wc -l)
            git commit -m "📰 Nalar auto: $COUNT artikel baru ($(date -u +%Y-%m-%d_%H:%M_UTC))"
            git push
            echo "has_new=true" >> $GITHUB_OUTPUT
          fi

      - name: Post ke Telegram
        if: steps.commit.outputs.has_new == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_post.py
